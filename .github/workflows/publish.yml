name: Publish website

# Builds the React site in `web/` and publishes `web/dist` to the `gh-pages`
# branch, which GitHub Pages serves at /applied-data-science/.
#
# The Quarto sources under `site/` are kept as an archive and are no longer
# deployed. They remain the prose of record for the analysis and are useful for
# comparing the React pages against the original reports.
#
# ONE-TIME SETUP — already done for this repository; recorded for anyone forking it:
#
#   1. The `gh-pages` branch must exist before this workflow can publish.
#   2. GitHub Pages then deploys from `gh-pages` / `/` automatically. No
#      Settings -> Pages change is required for a project site; confirm with
#      `gh api repos/<owner>/<repo>/pages`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    name: build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      # The build copies index.html to 404.html so BrowserRouter deep links work
      # on GitHub Pages. `publish_dir` is the Vite output, not the repo root.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
